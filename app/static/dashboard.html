<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Dispute Engine | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cocoa-dark: #12100e;
        --cocoa-muted: #2a2420;
        --pearl-cream: #fdfbf7;
        --accent-gold: #c0a080;
      }

      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--cocoa-dark);
        color: var(--pearl-cream);
      }

      .glass-panel {
        background: rgba(42, 36, 32, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(192, 160, 128, 0.1);
        border-radius: 24px;
      }

      .premium-input {
        background: rgba(18, 16, 14, 0.6);
        border: 1px solid rgba(192, 160, 128, 0.2);
        color: var(--pearl-cream);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .premium-input:focus {
        border-color: var(--accent-gold);
        box-shadow: 0 0 0 2px rgba(192, 160, 128, 0.1);
        background: rgba(18, 16, 14, 0.8);
        outline: none;
      }

      .btn-gold {
        background: var(--accent-gold);
        color: var(--cocoa-dark);
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(192, 160, 128, 0.3);
        filter: brightness(1.1);
      }

      .reasoning-step {
        border-left: 2px solid var(--accent-gold);
        padding-left: 1.5rem;
        position: relative;
      }

      .reasoning-step::before {
        content: "";
        position: absolute;
        left: -6px;
        top: 0;
        width: 10px;
        height: 10px;
        background: var(--accent-gold);
        border-radius: 50%;
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .shimmer {
        background: linear-gradient(
          90deg,
          rgba(192, 160, 128, 0) 0%,
          rgba(192, 160, 128, 0.05) 50%,
          rgba(192, 160, 128, 0) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <header class="flex justify-between items-center mb-12">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-white">
            Dispute <span class="text-[#C0A080]">Engine.</span>
          </h1>
          <p class="text-gray-400 mt-1">Autonomous Financial Compliance AI</p>
        </div>
        <div class="hidden md:flex items-center space-x-4">
          <div
            class="flex items-center space-x-2 bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-sm border border-green-500/20"
          >
            <span
              class="w-2 h-2 bg-green-400 rounded-full animate-pulse"
            ></span>
            <span>System Online</span>
          </div>
        </div>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Dispute Entry Form -->
        <section class="glass-panel p-8">
          <h2 class="text-xl font-semibold mb-6 flex items-center">
            <svg
              class="w-5 h-5 mr-2 text-[#C0A080]"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              ></path>
            </svg>
            New Analysis Request
          </h2>

          <form id="disputeForm" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="text-sm text-gray-400">Transaction Amount</label>
                <input
                  name="txn_amount"
                  type="number"
                  value="12500"
                  class="w-full px-4 py-3 rounded-xl premium-input"
                />
              </div>
              <div class="space-y-2">
                <label class="text-sm text-gray-400">Bank</label>
                <input
                  name="bank"
                  type="text"
                  value="HDFC Bank"
                  class="w-full px-4 py-3 rounded-xl premium-input"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-sm text-gray-400">Dispute Type</label>
              <select
                name="dispute_type"
                class="w-full px-4 py-3 rounded-xl premium-input appearance-none"
              >
                <option value="double_debit">Double Debit</option>
                <option value="unauthorized">Unauthorized Transaction</option>
                <option value="refund_not_received">Refund Pending</option>
                <option value="failed_txn_debit">Failed Txn but Debited</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="text-sm text-gray-400">Status</label>
                <select
                  name="txn_status"
                  class="w-full px-4 py-3 rounded-xl premium-input appearance-none"
                >
                  <option value="failed">Failed</option>
                  <option value="success">Success</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="text-sm text-gray-400">Time</label>
                <input
                  name="txn_time"
                  type="time"
                  value="14:30"
                  class="w-full px-4 py-3 rounded-xl premium-input"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-sm text-gray-400">Merchant Type</label>
              <input
                name="merchant_type"
                type="text"
                value="E-Commerce"
                class="w-full px-4 py-3 rounded-xl premium-input"
              />
            </div>

            <button
              type="submit"
              class="w-full py-4 rounded-2xl btn-gold flex items-center justify-center space-x-2"
            >
              <span>Evaluate Dispute</span>
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                ></path>
              </svg>
            </button>
          </form>
        </section>

        <!-- Results & Agent Context -->
        <section id="resultsSection" class="space-y-8 hidden">
          <!-- Decision Card -->
          <div
            class="glass-panel p-8 bg-gradient-to-br from-[#2A2420]/60 to-transparent"
          >
            <div class="flex justify-between items-start mb-6">
              <div>
                <span
                  class="text-xs uppercase tracking-widest text-[#C0A080] font-bold"
                  >Final Decision</span
                >
                <h3
                  id="resultDecision"
                  class="text-4xl font-bold mt-2 text-white italic"
                >
                  ---
                </h3>
              </div>
              <div class="text-right">
                <div class="text-xs uppercase tracking-widest text-gray-400">
                  Confidence
                </div>
                <div
                  id="resultConfidence"
                  class="text-2xl font-semibold text-white"
                >
                  0%
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-6 pt-6 border-t border-white/10">
              <div>
                <span class="text-xs text-gray-400 block mb-1">Risk Score</span>
                <div
                  id="riskMeter"
                  class="w-full h-2 bg-black/40 rounded-full mt-2 overflow-hidden"
                >
                  <div
                    id="riskBar"
                    class="h-full bg-red-500 rounded-full"
                    style="width: 0%"
                  ></div>
                </div>
                <span id="riskLabel" class="text-sm mt-2 block font-medium"
                  >0.00</span
                >
              </div>
              <div>
                <span class="text-xs text-gray-400 block mb-1"
                  >Policy Clause</span
                >
                <code
                  id="policyClause"
                  class="text-sm bg-white/5 px-2 py-1 rounded border border-white/10 text-[#C0A080]"
                  >---</code
                >
              </div>
            </div>
          </div>

          <!-- Agent Reasoning Log -->
          <div class="glass-panel p-8">
            <h3
              class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-6 border-b border-white/10 pb-4"
            >
              Agentic Reasoning Log
            </h3>
            <div id="reasoningLog" class="space-y-6">
              <!-- Steps will be injected here -->
            </div>
          </div>
        </section>

        <!-- Loading State Placeholder -->
        <section
          id="loadingState"
          class="hidden h-full flex items-center justify-center glass-panel"
        >
          <div class="text-center space-y-4">
            <div
              class="w-16 h-16 border-4 border-[#C0A080]/20 border-t-[#C0A080] rounded-full animate-spin mx-auto"
            ></div>
            <p class="text-lg text-gray-300 animate-pulse">
              Agent is consulting banking regulations...
            </p>
          </div>
        </section>
      </div>
    </div>

    <script>
      const form = document.getElementById("disputeForm");
      const resultsSection = document.getElementById("resultsSection");
      const loadingState = document.getElementById("loadingState");

      form.onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        data.txn_amount = parseFloat(data.txn_amount);

        // Show loading
        form.parentElement.classList.add("opacity-50", "pointer-events-none");
        loadingState.classList.remove("hidden");
        resultsSection.classList.add("hidden");

        try {
          const response = await fetch("/api/v1/evaluate_dispute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const result = await response.json();

          if (result.success) {
            displayResult(result.data);
          } else {
            alert("Error: " + result.error);
          }
        } catch (err) {
          alert("Connection error: " + err.message);
        } finally {
          form.parentElement.classList.remove(
            "opacity-50",
            "pointer-events-none",
          );
          loadingState.classList.add("hidden");
        }
      };

      function displayResult(data) {
        resultsSection.classList.remove("hidden");

        document.getElementById("resultDecision").innerText = data.decision;
        document.getElementById("resultConfidence").innerText =
          (data.confidence * 100).toFixed(0) + "%";
        document.getElementById("riskBar").style.width =
          data.risk_score * 100 + "%";
        document.getElementById("riskLabel").innerText =
          data.risk_score.toFixed(2);
        document.getElementById("policyClause").innerText = data.policy_clause;

        const log = document.getElementById("reasoningLog");
        log.innerHTML = "";
        data.reasoning_chain.forEach((step) => {
          const div = document.createElement("div");
          div.className = "reasoning-step";
          div.innerHTML = `<p class="text-gray-300 text-sm italic">"${step}"</p>`;
          log.appendChild(div);
        });
      }
    </script>
  </body>
</html>
